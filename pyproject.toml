[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "troll"
version = "0.1.0"
description = "A nano-style terminal editor with syntax highlighting, smart formatting and an interactive git commit editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
troll = "troll.cli:main"
git-troll = "troll.cli:git_main"

[tool.setuptools]
packages = ["troll", "troll.tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
